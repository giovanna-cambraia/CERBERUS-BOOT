[package]
name = "cerberus-bl2-entry"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[[bin]]
name = "bl2"
path = "src/main.rs"

[dependencies]
cerberus-bl2 = { path = "..", features = ["crypto"] }

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
codegen-units = 1

[profile.dev]
panic = "abort"[package]
