[package]
name = "cerberus-bl2"
version = "0.1.0"
edition = "2021"

[lib]
name = "cerberus_bl2"
path = "src/lib.rs"

[features]
default = []
# Real SHA-256 and Ed25519 for the target. Off by default so the core
# stays dependency-free.
crypto = ["dep:sha2", "dep:ed25519-dalek"]

[dependencies]
sha2 = { version = "0.10", default-features = false, optional = true }
ed25519-dalek = { version = "2", default-features = false, optional = true }

[dev-dependencies]
ed25519-dalek = "2"
sha2 = "0.10"
cerberus-cli = { path = "../../tools/cerberus-cli" }

[profile.release]
opt-level = "z"
lto = "fat"
panic = "abort"
codegen-units = 1
